<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bubudoo · Студия</title>
<link rel="icon" href="assets/img/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#ff8fb1">
<meta name="apple-mobile-web-app-title" content="Bubudoo">
<meta name="application-name" content="Bubudoo">
<meta name="msapplication-TileColor" content="#ffd6e3">
<meta name="msapplication-config" content="browserconfig.xml">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@500;600;700;800&family=Comfortaa:wght@700&family=Marmelad&family=Pangolin&family=Caveat:wght@700&family=Pacifico&family=Lobster&display=swap" rel="stylesheet">
<style>
:root{--pk:#ff8fb1;--pk2:#ffd6e3;--pk3:#fff0f5;--ink:#5b3a4a;--soft:#a67c8f}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Fredoka,Nunito,ui-rounded,system-ui,sans-serif;color:var(--ink);
background:radial-gradient(circle at 15% 8%,#ffe0ea,transparent 42%),radial-gradient(circle at 88% 92%,#d9efff,transparent 46%),#fff6f9;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid #ff5c8a;outline-offset:2px}
.fl{position:fixed;bottom:-40px;font-size:22px;opacity:.5;pointer-events:none;animation:up linear infinite}
.fl-face img{width:26px;height:26px;display:block}
#hero{min-height:100dvh;display:flex;flex-direction:column}
.hero-logo{align-self:flex-start;margin:14px 0 0 4px}
.hero-main{flex:1;width:100%;max-width:min(94vw,2600px);margin:0 auto;display:grid;grid-template-columns:1fr 1.15fr;align-items:center;gap:clamp(24px,4vw,120px);padding:0 clamp(20px,6vw,72px) clamp(16px,3vh,36px)}
.hero-left{display:flex;flex-direction:column;align-items:flex-start;gap:clamp(16px,2.4vh,26px);max-width:clamp(380px,30vw,760px)}
.hero-sub{margin:0;font-size:clamp(15px,1.3vw,30px);line-height:1.55;color:var(--soft)}
.hero-cta{display:inline-flex;align-items:center;gap:10px;padding:clamp(14px,1.4vw,22px) clamp(26px,2.6vw,46px);border-radius:99px;background:var(--pk);color:#fff;font-weight:600;font-size:clamp(16px,1.6vw,26px);box-shadow:0 12px 26px #ff8fb155;transition:transform .15s,box-shadow .15s}
.hero-cta i{font-style:normal;transition:transform .15s}
.hero-cta:hover{transform:translateY(-2px);box-shadow:0 16px 32px #ff8fb166}
.hero-cta:hover i{transform:translateX(4px)}
.hero-right{min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,1.6vh,16px)}
.hero-img{width:100%;max-width:clamp(320px,42vw,1500px);max-height:min(58dvh,1500px);object-fit:contain;filter:drop-shadow(0 18px 26px rgba(91,58,74,.18))}
.hero-word{font-family:Fredoka,sans-serif;font-weight:600;font-size:clamp(26px,3.6vw,120px);color:#ff5c8a;transform:rotate(-2deg);text-shadow:0 3px 0 #fff,0 6px 14px rgba(255,140,180,.35)}
@media(max-width:760px){
 .hero-main{grid-template-columns:1fr;grid-template-rows:auto auto;align-content:center;text-align:center;padding:0 26px calc(18px + env(safe-area-inset-bottom));gap:clamp(14px,3vh,28px)}
 .hero-right{order:1}.hero-left{order:2;align-items:center;max-width:420px;margin:0 auto}
 .hero-img{max-height:34dvh}
 .hero-word{font-size:clamp(24px,7vw,32px)}
 .hero-cta{align-self:center;width:100%;justify-content:center;max-width:340px}
}
@media(max-height:560px) and (max-width:760px){.hero-img{max-height:26dvh}.hero-word{font-size:clamp(20px,5vw,26px)}.hero-sub{font-size:14px}}

@keyframes up{to{transform:translateY(-115vh) rotate(20deg)}}
.app{position:relative;max-width:1040px;margin:0 auto;padding:18px 16px 28px;display:flex;flex-direction:column;min-height:100vh}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.lang{position:relative;display:flex;background:#fff;border-radius:99px;padding:4px;box-shadow:0 4px 14px #ff8fb133}
.lang i{position:absolute;top:4px;left:4px;width:48px;height:calc(100% - 8px);background:var(--pk);border-radius:99px;box-shadow:0 3px 10px #ff8fb188;transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.lang button{position:relative;z-index:1;width:48px;padding:6px 0;border-radius:99px;font-size:14px;font-weight:500;transition:color .2s}
.lang button.on{color:#fff}
.ft{margin-top:auto;padding-top:44px;text-align:center;color:var(--soft);font-size:13px;line-height:1.6}
.ft div{border-top:2px dotted var(--pk2);padding-top:16px}
.ft b{display:block;color:var(--ink);font-weight:500;font-size:14px}
.ft p{margin:2px auto 0;max-width:520px}
.logo{font-size:20px;padding:8px 16px;background:#fff;border-radius:99px;box-shadow:0 4px 14px #ff8fb133}
.logo small{color:var(--soft);font-size:14px;margin-left:4px}
.logo{display:inline-flex;align-items:center;gap:8px}
.mark{height:36px;width:auto;margin:-6px 0;flex:none}
.hidden{display:none!important}
h1{font-size:clamp(28px,5vw,44px);text-align:center;margin:34px 0 4px}
html:not([lang=en]) h1,html:not([lang=en]) .cc h2,html:not([lang=en]) .logo b{font-weight:800}
.sub{text-align:center;color:var(--soft);margin:0 0 26px}
.cards{display:flex;gap:22px;justify-content:center;flex-wrap:wrap}
.cc{width:min(300px,86vw);background:#fff;border-radius:38px 38px 38px 12px;padding:16px 16px 20px;box-shadow:0 10px 30px #ff8fb133;transition:transform .25s}
.cc:nth-child(2){border-radius:38px 38px 12px 38px}
.cc:hover{transform:translateY(-8px) rotate(-1.5deg)}
.cc:nth-child(2):hover{transform:translateY(-8px) rotate(1.5deg)}
.cc h2{margin:6px 0 0;font-size:30px}.cc span{color:var(--soft)}
.cc svg,.stage svg{width:100%;height:auto;display:block}
#edit{display:grid;grid-template-columns:minmax(300px,.8fr) minmax(0,1fr);gap:24px;margin-top:22px;align-items:start}
.sw{order:2;background:#fff;border-radius:34px;padding:16px;box-shadow:0 10px 30px #ff8fb133;width:100%;max-width:620px;justify-self:center;position:sticky;top:12px}
.stage{width:min(100%,max(240px,calc((100vh - 200px)*.882)));margin:0 auto}
.stage.bn svg{animation:bn .45s}
@keyframes bn{30%{transform:scale(1.04,.96)}60%{transform:scale(.98,1.03)}}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.tools button{background:var(--pk3);border-radius:18px;padding:9px 4px;font-size:13px;display:flex;flex-direction:column;gap:2px;align-items:center;transition:background .2s}
.tools button b{font-size:20px;font-weight:400}
.tools button:hover{background:var(--pk2)}
.tools .go{background:var(--pk);color:#fff}.tools .go:hover{background:#ff76a0}
.panel{order:1;background:#fff;border-radius:34px;padding:16px;box-shadow:0 10px 30px #ff8fb133;max-height:calc(100vh - 90px);overflow-y:auto;overflow-x:hidden}
.seg{display:flex;background:var(--pk3);border-radius:99px;padding:4px;margin-bottom:14px}
.seg button{flex:1;padding:9px;border-radius:99px;font-weight:500}
.seg .on{background:var(--pk);color:#fff;box-shadow:0 4px 10px #ff8fb166}
.seg button{display:inline-flex;align-items:center;justify-content:center;gap:7px}
.seg-ic{width:24px;height:24px;flex:none}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tabs button{padding:8px 13px;border-radius:99px;background:var(--pk3);font-size:14px}
.tabs .on{background:var(--ink);color:#fff}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.opts button{background:var(--pk3);border:3px solid transparent;border-radius:22px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:14px;transition:transform .15s}
.opts button:hover{transform:translateY(-3px)}
.opts .on{border-color:var(--pk);background:#fff;box-shadow:0 4px 12px #ff8fb155}
.opts b{font-size:28px;font-weight:400;line-height:1;height:34px;display:flex;align-items:center}
.opts i{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #e9c9d6}
.stage{position:relative}#tc{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none;pointer-events:none}
.txp{display:grid;gap:12px}.txp .lab{font-size:13px;color:var(--soft);margin-bottom:-6px}
.txp input[type=text]{font:inherit;width:100%;padding:11px 14px;border-radius:16px;border:2px solid var(--pk2);background:var(--pk3);color:var(--ink)}
.txp input[type=text]:focus{outline:none;border-color:var(--pk)}.txp input[type=range]{width:100%;accent-color:var(--pk)}
.fonts{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.fonts button,.pill{padding:9px 10px;border-radius:16px;background:var(--pk3);border:2px solid transparent}
.pill{border-radius:99px;font-size:14px}.fonts .on,.pill.on{border-color:var(--pk);background:#fff}.pill.on{background:var(--pk);color:#fff}
.sws,.row{display:flex;gap:8px;flex-wrap:wrap}.sws button{width:32px;height:32px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #e9c9d6}.sws .on{box-shadow:0 0 0 3px var(--pk)}
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sh-bg{position:absolute;inset:0;background:rgba(91,58,74,.4);backdrop-filter:blur(3px);animation:fade .2s}
.sh-box{position:relative;width:min(600px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:28px 28px 0 0;padding:12px 16px calc(18px + env(safe-area-inset-bottom));animation:slide .3s cubic-bezier(.2,.9,.3,1)}
.grab{width:44px;height:5px;border-radius:9px;background:var(--pk2);margin:0 auto 12px;touch-action:none}
.sh-box h3{margin:0 0 14px;text-align:center;font-size:20px}
.x{position:absolute;top:12px;right:14px;width:34px;height:34px;border-radius:50%;background:var(--pk3)}
.fmts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.fmt{background:var(--pk3);border-radius:20px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;border:2px solid transparent;transition:transform .15s,border-color .15s}
.fmt:hover{border-color:var(--pk);transform:translateY(-2px)}.fmt.busy{opacity:.5;pointer-events:none}
.fmt .th{height:108px;display:flex;align-items:center}
.fmt img{max-height:108px;max-width:100%;border-radius:10px;background:repeating-conic-gradient(#fff 0 25%,#f3e6ec 0 50%) 0 0/12px 12px;min-width:40px;min-height:40px}
.fmt b{font-size:14px;font-weight:600}.fmt small{color:var(--soft);font-size:12px}
.chk{display:flex;gap:8px;align-items:center;justify-content:center;margin:14px 0 0;font-size:14px}.chk input{accent-color:var(--pk);width:18px;height:18px}
@keyframes slide{from{transform:translateY(100%)}}@keyframes fade{from{opacity:0}}
@media(min-width:700px){.sheet{align-items:center}.sh-box{border-radius:28px}.fmts{grid-template-columns:repeat(3,1fr)}.grab{display:none}}
@media(max-width:700px){
 #edit{grid-template-columns:minmax(0,1fr);gap:14px;margin-top:14px}
 .sw{order:1;position:sticky;top:8px;z-index:5;padding:10px;border-radius:26px;max-width:none;justify-self:stretch}
 .stage{width:min(100%,calc(min(36vh,330px)*.882))}
 .tools{margin-top:8px;gap:6px}
 .tools button{padding:6px 2px;font-size:11.5px;border-radius:14px}
 .tools button b{font-size:17px}
 .panel{order:2;max-height:none;overflow:visible;padding:14px;border-radius:26px}
}
@media(max-width:520px){
 .top{flex-wrap:nowrap}
 .logo{font-size:17px;padding:8px 12px;gap:6px}.logo small{display:none}.mark{height:32px;margin:-4px 0}
 .lang i,.lang button{width:42px}
 h1{margin-top:22px}
 .cards{gap:12px;flex-wrap:nowrap}
 .cc{width:calc(50% - 6px);padding:10px 10px 14px}
 .cc h2{font-size:22px}
}
.tr{display:flex;align-items:center;gap:8px}
.faqb{width:38px;height:38px;border-radius:50%;background:var(--pk);box-shadow:0 4px 12px #ff8fb188;font-weight:800;font-size:20px;line-height:1;color:#fff;transition:transform .15s,background .2s}
.faqb:hover{background:#ff76a0;transform:scale(1.08)}
.fl2{margin-top:8px!important}.fl2 button{text-decoration:underline;color:var(--soft);font-size:13px}
.q{background:var(--pk3);border-radius:18px;margin-bottom:8px;overflow:hidden}
.q summary{padding:13px 16px;cursor:pointer;font-weight:600;font-size:15px;list-style:none;display:flex;justify-content:space-between;gap:10px}
.q summary::-webkit-details-marker{display:none}.q summary::after{content:'+';color:var(--pk);font-size:22px;line-height:1}.q[open] summary::after{content:'−'}
.q p{margin:0;padding:0 16px 14px;line-height:1.5;font-size:14.5px}.q a,.help a:not(.btn){color:#d6457a;font-weight:600}
.help{margin-top:14px;padding:16px;border-radius:22px;background:linear-gradient(135deg,#ffe0ea,#e3f1ff)}
.help h4{margin:0 0 6px;font-size:17px}.help p{margin:0 0 12px;font-size:14.5px;line-height:1.5}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 18px;border-radius:99px;background:var(--pk);color:#fff;text-decoration:none;font-weight:500}
.ico{width:17px;height:17px;flex:none;display:inline-flex}.ico svg{width:100%;height:100%}
.help details{margin-top:12px;font-size:14px}.help summary{cursor:pointer;font-weight:600}.help ul{margin:8px 0 0;padding-left:20px;line-height:1.55}
.btn2{background:#fff;color:var(--pk);box-shadow:inset 0 0 0 2px var(--pk)}
.help.flash{animation:fl 1.4s}@keyframes fl{40%{box-shadow:0 0 0 7px #ff8fb166}}
@media(max-width:440px){.lang i,.lang button{width:38px}}
@media(max-width:380px){.logo{font-size:15px!important}.tr{gap:6px}}
@media(max-width:350px){.faqb{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="fl"></div>
<section id="hero">
  <button class="logo hero-logo" id="heroHome"><img class="mark" alt="" width="228" height="160" src="assets/img/logo.webp"><b data-k="logo">Bubudoo</b></button>
  <div class="hero-main">
    <div class="hero-left">
      <p class="hero-sub" data-k="heroSub"></p>
      <button class="hero-cta" id="heroCta"><span data-k="heroCta"></span> <i>→</i></button>
    </div>
    <div class="hero-right">
      <img class="hero-img" alt="Bubu & Dudu" src="assets/img/hero-pair.webp">
      <div class="hero-word">Bubudoo</div>
    </div>
  </div>
</section>

<main class="app hidden">
<header class="top hidden">
  <button class="logo" id="home"><img class="mark" alt="" width="228" height="160" src="assets/img/logo.webp"><b data-k="logo">Bubudoo</b><small data-k="studio">студия</small></button>
  <div class="tr"><button class="faqb" id="faqb" aria-label="FAQ">?</button><div class="lang" role="group" aria-label="Language"><i id="th"></i><button data-l="ru">RU</button><button data-l="uk">UA</button><button data-l="en">EN</button></div></div>
</header>

<section id="pick" class="hidden">
  <h1 data-k="h1">Кого будем наряжать?</h1>
  <p class="sub" data-k="sub">Выбери героя. Потом его можно поменять 💕</p>
  <div class="cards">
    <button class="cc" data-ch="bubu"><div id="pv-bubu"></div><h2 data-k="bubu">Бубу</h2><span data-k="bubuS">пандочка</span></button>
    <button class="cc" data-ch="dudu"><div id="pv-dudu"></div><h2 data-k="dudu">Дуду</h2><span data-k="duduS">мишка</span></button>
  </div>
</section>

<section id="edit" class="hidden">
  <div class="sw">
    <div class="stage" id="stage"><div id="sv"></div><canvas id="tc"></canvas></div>
    <div class="tools">
      <button id="undo"><b>↶</b><span data-k="undo">Назад</span></button>
      <button id="rnd"><b>🎲</b><span data-k="rnd">Случайно</span></button>
      <button id="rst"><b>↺</b><span data-k="rst">Сначала</span></button>
      <button id="dl" class="go"><b>⬇</b><span data-k="dl">Скачать</span></button>
    </div>
  </div>
  <div class="panel">
    <div class="seg" id="seg"></div>
    <div class="tabs" id="tabs"></div>
    <div class="opts" id="opts"></div>
    <div class="txp hidden" id="txp"></div>
  </div>
</section>
<footer class="ft hidden"><div><b data-k="foot1">© 2026 Bubudoo · studio</b><p data-k="foot2"></p><p class="fl2"><button data-open="faq" data-k="ftFaq"></button> · <button data-open="help" data-k="ftHelp"></button></p></div></footer>
</main>

<div class="sheet hidden" id="faq" role="dialog" aria-modal="true" aria-labelledby="faqt">
  <div class="sh-bg" data-close></div>
  <div class="sh-box"><div class="grab"></div><button class="x" data-close aria-label="Close">✕</button>
    <h3 id="faqt" data-k="faqT"></h3><div id="faqc"></div></div>
</div>
<div class="sheet hidden" id="dlm" role="dialog" aria-modal="true" aria-labelledby="dlt">
  <div class="sh-bg" data-close></div>
  <div class="sh-box"><div class="grab"></div><button class="x" data-close aria-label="Close">✕</button>
    <h3 id="dlt" data-k="dlTitle"></h3>
    <div class="fmts" id="fmts"></div>
    <label class="chk"><input type="checkbox" id="outl" checked> <span data-k="dlOl"></span></label>
  </div>
</div>
<script>
const $=q=>document.querySelector(q),
HP='M0 8C-14-2-10-14 0-6C10-14 14-2 0 8Z',
SP='M0-10L2.4-3.3 9.5-3.1 3.9 1.3 5.9 8.1 0 4.1-5.9 8.1-3.9 1.3-9.5-3.1-2.4-3.3Z';

const P={
 bubu:{n:'Бубу',dark:'#3b3340',line:'#3b3340',fur:[['Классика','#ffffff'],['Сливки','#fff1e0'],['Розовый','#ffe1ec'],['Небесный','#e3f1ff']]},
 dudu:{n:'Дуду',dark:'#5a3a2e',line:'#6b4230',fur:[['Карамель','#c98b5a'],['Шоколад','#9a6444'],['Мёд','#e6b070'],['Латте','#d9b99b']]}
};

const eye=(f)=>({f});
const O={
 eyes:[
  {n:'Точки',e:'⚫',f:(x,i,h)=>`<ellipse cx="${x}" cy="142" rx="7" ry="9" fill="${i}"/><circle cx="${x+2.5}" cy="138.5" r="3" fill="${h}"/>`},
  {n:'Блёстки',e:'✨',f:(x,i,h)=>`<ellipse cx="${x}" cy="142" rx="9" ry="11" fill="${i}"/><circle cx="${x+3}" cy="137" r="3.6" fill="${h}"/><circle cx="${x-3}" cy="146" r="2" fill="${h}"/>`},
  {n:'Радость',e:'😊',f:(x,i)=>`<path d="M${x-9} 147Q${x} 132 ${x+9} 147" stroke="${i}" stroke-width="4.5" fill="none" stroke-linecap="round"/>`},
  {n:'Сонные',e:'😴',f:(x,i)=>`<path d="M${x-9} 141Q${x} 152 ${x+9} 141" stroke="${i}" stroke-width="4.5" fill="none" stroke-linecap="round"/>`},
  {n:'Сердечки',e:'😍',f:x=>`<path transform="translate(${x},142) scale(1.2)" d="${HP}" fill="#ff5c8a"/>`},
  {n:'Звёздочки',e:'🤩',f:x=>`<path transform="translate(${x},142) scale(1.3)" d="${SP}" fill="#ffd54a"/>`}
 ],
 mouth:[
  {n:'Улыбка',e:'🙂',f:m=>`<path d="M138 168Q150 182 162 168" stroke="${m}" stroke-width="3.5" fill="none" stroke-linecap="round"/>`},
  {n:'Ура!',e:'😄',f:m=>`<path d="M136 168Q150 198 164 168Z" fill="#7a3145" stroke="${m}" stroke-width="3" stroke-linejoin="round"/><path d="M144 183Q150 175 156 183Q150 189 144 183Z" fill="#ff8fa3"/>`},
  {n:'Кошачий',e:'😺',f:m=>`<path d="M134 167Q142 180 150 169Q158 180 166 167" stroke="${m}" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`},
  {n:'Язычок',e:'😛',f:m=>`<path d="M146 175v7a4 4 0 0 0 8 0v-7" fill="#ff8fa3" stroke="${m}" stroke-width="2.5"/><path d="M138 168Q150 182 162 168" stroke="${m}" stroke-width="3.5" fill="none" stroke-linecap="round"/>`},
  {n:'Ой',e:'😮',f:m=>`<ellipse cx="150" cy="176" rx="5" ry="6.5" fill="#7a3145" stroke="${m}" stroke-width="3"/>`}
 ],

$('#fl').innerHTML=Array.from({length:12},(_,i)=>{const it=['💗','✨','🌸','💕','face:bubu','face:dudu'][i%6],st=`left:${(i*8.7+3)%98}%;animation-duration:${14+(i*5)%11}s;animation-delay:-${(i*3)%14}s`;
 return it.startsWith('face:')?`<span class="fl fl-face" style="${st}"><img src="assets/img/faces/${it.slice(5)}.png" alt=""></span>`:`<span class="fl" style="${st}">${it}</span>`}).join('');
$('.lang').onclick=e=>{const l=e.target.closest('button')?.dataset.l;if(l)setLang(l)};
let sv;try{sv=localStorage.getItem('lang')}catch(e){}
const nl=navigator.language||'';
setLang(LG.includes(sv)?sv:nl.startsWith('uk')?'uk':nl.startsWith('ru')?'ru':'en');
</script>
</body>
</html>
